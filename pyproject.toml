[project]
name = "py-sim"
description = "Python framework for simulating physical systems consisting of multiple, interacting entities."
authors = [
    {name = "David Zwicker", email="david.zwicker@ds.mpg.de"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Requirements for package
dependencies = [
    "matplotlib>=3.1",
    "networkx>=2",
    "numba>=0.59",
    "numpy>=1.22",
    "py-droplets>=0.19",
    "py-modelrunner>=0.14",
    "py-pde>=0.39",
    "scipy>=1.4",
    "sympy>=1.5",
    "zarr>=2.16",
]

[project.urls]
homepage = "https://github.com/zwicker-group/py-sim"
repository = "https://github.com/zwicker-group/py-sim"

[build-system]
requires = [
    "setuptools>=61",
    "setuptools_scm[toml]>=6.2",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
zip-safe = false  # required for mypy to find the py.typed file

[tool.setuptools.packages.find]
include = ["sim*"]
namespaces = false

[tool.setuptools_scm]
write_to = "sim/_version.py"

[tool.black]
target_version = ["py39"]
extend-exclude = "submodules"

[tool.isort]
profile = "black"
src_paths = ["sim", "examples", "tests"]
extend_skip_glob = ["submodules/*"]
known_first_party = ["droplets", "modelrunner", "pde", "phasesep"]
known_self = ["sim", "helpers"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "SELF", "LOCALFOLDER"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
norecursedirs="tests/helpers"
filterwarnings = [
    'ignore:.*importing the ABCs from.*:DeprecationWarning',
    'ignore:.*IPython.utils.signatures backport for Python 2 is deprecated.*:DeprecationWarning',
    'ignore:.*scipy.sparse.*:DeprecationWarning',
]

[tool.coverage.report]
omit = ['*/test*']

[tool.mypy]
python_version = "3.9"
plugins = "numpy.typing.mypy_plugin"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ["submodules"]

[[tool.mypy.overrides]]
module = "numba.*"
ignore_missing_imports = true
ignore_errors = false
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = [
    "h5py.*",
    "IPython.*",
    "ipywidgets.*",
    "matplotlib.*",
    "mpl_toolkits.*",
    "mpi4py.*",
    "napari.*",
    "networkx.*",
    "numba_mpi.*",
    "numcodecs.*",
    "pandas.*",
    "pyfftw.*",
    "pytest.*",
    "qtpy.*",
    "rocket_fft.*",
    "scipy.*",
    "sympy.*",
    "ternary.*",
    "tqdm.*",
    "zarr.*",
]
ignore_missing_imports = true