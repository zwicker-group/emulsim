[project]
name = "py-sim"
description = "Python framework for simulating physical systems consisting of multiple, interacting entities."
authors = [
    {name = "David Zwicker", email="david.zwicker@ds.mpg.de"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dynamic = ["version"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Requirements for package
dependencies = [
    "matplotlib>=3.1",
    "networkx>=2",
    "numba>=0.59",
    "numpy>=1.22",
    "py-droplets>=0.20",
    "py-modelrunner>=0.18",
    "py-pde>=0.38",
    "scipy>=1.4",
    "sympy>=1.5",
    "zarr>=2.16",
]

[project.urls]
homepage = "https://github.com/zwicker-group/py-sim"
repository = "https://github.com/zwicker-group/py-sim"

[build-system]
requires = [
    "setuptools>=61",
    "setuptools_scm[toml]>=6.2",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
zip-safe = false  # required for mypy to find the py.typed file

[tool.setuptools.packages.find]
include = ["sim*"]
namespaces = false

[tool.setuptools_scm]
write_to = "sim/_version.py"

[tool.ruff]
target-version = "py310"
exclude = ["scripts/templates", "submodules"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "UP",  # pyupgrade
    "I",  # isort
    "A",  # flake8-builtins 
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "FA", # flake8-future-annotations
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "LOG", # flake8-logging
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
]
ignore = ["B007", "B027", "B028", "SIM108", "ISC001", "PT006", "PT011", "RET504", "RET505", "RET506"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "own-modules", "first-party", "self", "local-folder"]

[tool.ruff.lint.isort.sections]
own-modules = ["droplets", "modelrunner", "pde", "phasesep"]
self = ["sim", "helpers"]

[tool.black]
target_version = ["py310"]
extend-exclude = "submodules"

[tool.isort]
profile = "black"
src_paths = ["sim", "examples", "tests"]
extend_skip_glob = ["submodules/*"]
known_first_party = ["droplets", "modelrunner", "pde", "phasesep"]
known_self = ["sim", "helpers"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "SELF", "LOCALFOLDER"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
norecursedirs="tests/helpers"
filterwarnings = [
    'ignore:.*importing the ABCs from.*:DeprecationWarning',
    'ignore:.*IPython.utils.signatures backport for Python 2 is deprecated.*:DeprecationWarning',
    'ignore:.*scipy.sparse.*:DeprecationWarning',
]

[tool.coverage.report]
omit = ['*/test*']

[tool.mypy]
python_version = "3.10"
plugins = "numpy.typing.mypy_plugin"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ["submodules"]

[[tool.mypy.overrides]]
module = "numba.*"
ignore_missing_imports = true
ignore_errors = false
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = [
    "h5py.*",
    "IPython.*",
    "ipywidgets.*",
    "matplotlib.*",
    "mpl_toolkits.*",
    "mpi4py.*",
    "napari.*",
    "networkx.*",
    "numba_mpi.*",
    "numcodecs.*",
    "pandas.*",
    "pyfftw.*",
    "pytest.*",
    "qtpy.*",
    "rocket_fft.*",
    "scipy.*",
    "sympy.*",
    "ternary.*",
    "tqdm.*",
    "zarr.*",
]
ignore_missing_imports = true