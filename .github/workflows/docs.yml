name: "Build documentation"

on: [push]

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v3
      with:
         submodules: 'true'
         token: ${{ secrets.ACCESS_TOKEN }}
    - uses: ammaraskar/sphinx-action@master
      with:
        docs-folder: "docs/"
