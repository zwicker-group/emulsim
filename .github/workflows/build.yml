name: build

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.13']

    steps:
    - uses: actions/checkout@v3
      with:
         submodules: 'true'
         token: ${{ secrets.ACCESS_TOKEN }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
    # We install a specific scipy version to circumvent problems
      run: |
        python -m pip install --upgrade pip
        pip install "scipy==1.10.*"
        pip install -r requirements.txt
        pip install -r tests/requirements.txt

    - name: Include submodules in python path
      run: |
        echo "PYTHONPATH=$PWD/submodules/py-droplets:$PWD/submodules/py-modelrunner:$PWD/submodules/py-pde:$PWD/submodules/py-phasesep:$PYTHONPATH" >> $GITHUB_ENV

    - name: Test with pytest
      env:
        NUMBA_WARNINGS: 1
        MPLBACKEND: agg
      run: |
        pip install pytest
        cd scripts
        python run_tests.py --unit --parallel

    - name: Test types with mypy
      continue-on-error: true
      run: |
        python -m mypy --config-file pyproject.toml --pretty --package sim
